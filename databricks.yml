
bundle:
  name: dlt_databricks

include:
  - resources/pipeline.yml
  - resources/job.yml

variables:
  catalog:
    description: Catalogo del ambiente

  storage_account:
    description: Storage account del ambiente

  alert_fallos_id:
    description: Alert ID para fallos

  alert_slo_id:
    description: Alert ID para SLO

  warehouse_id:
    description: SQL Warehouse del ambiente

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://adb-7405614611005137.17.azuredatabricks.net
      profile: DEV

    variables:
      catalog: adbdep_0013
      storage_account: adlsproject13dev2
      alert_fallos_id: "1821046379089397"
      alert_slo_id: "1821046379089402"
      warehouse_id: "361ec3e9390e2a86"

  uat:
    mode: development

    workspace:
      host: https://adb-7405609956465058.18.azuredatabricks.net
      profile: UAT

    variables:
      catalog: adbuat_0013
      storage_account: adlsproject13uat2
      alert_fallos_id: "2584593029264338"
      alert_slo_id: "2584593029264339"
      warehouse_id: "7405614611005137"